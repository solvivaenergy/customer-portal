name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          BASE_PATH: /customer-portal/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MONITORING_API_URL: https://monitoring.solvivaenergy.com
          VITE_N8N_WEBHOOK_URL: https://solviva.app.n8n.cloud/webhook
          # Keep ticket/PMS submissions off on the demo build; flip to "true" when test tickets in Odoo are wanted.
          VITE_ENABLE_SUBMISSIONS: ${{ vars.VITE_ENABLE_SUBMISSIONS || 'false' }}
        run: |
          npm run build
          # GitHub Pages serves 404.html for unknown paths: hand the SPA its own index so deep links work.
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
