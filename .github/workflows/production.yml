name: Deploy to production (www.solvivaenergy.com/mysolviva)

# Every push to main also goes live on the website's /mysolviva path, as a Cloudflare Worker with the
# build as static assets (wrangler.toml, worker/index.js). The demo on GitHub Pages is pages.yml.
#
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit + Workers Routes: Edit on solvivaenergy.com),
# CLOUDFLARE_ACCOUNT_ID, VITE_SUPABASE_ANON_KEY. Variables: VITE_SUPABASE_URL and, optionally,
# VITE_N8N_WEBHOOK_URL_PRODUCTION / VITE_ENABLE_SUBMISSIONS_PRODUCTION / VITE_ENABLE_PMS_PRODUCTION to
# override the defaults in scripts/build-production.mjs. Without the Cloudflare token the build still
# runs and the deploy step is skipped with a warning.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.solvivaenergy.com/mysolviva/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build for /mysolviva
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_N8N_WEBHOOK_URL: ${{ vars.VITE_N8N_WEBHOOK_URL_PRODUCTION }}
          VITE_ENABLE_SUBMISSIONS: ${{ vars.VITE_ENABLE_SUBMISSIONS_PRODUCTION }}
          VITE_ENABLE_PMS: ${{ vars.VITE_ENABLE_PMS_PRODUCTION }}
        run: node scripts/build-production.mjs

      - name: Check for Cloudflare credentials
        id: cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set as a repository secret: built, not deployed."
          fi

      - name: Deploy the Worker
        if: steps.cloudflare.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
